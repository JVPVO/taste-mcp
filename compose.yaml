services:
  taste-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8787}:8787"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DATABASE_PATH: /app/data/taste.sqlite
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - taste-mcp-data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  taste-mcp-data:
